<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="QA Engineer Academy - plateforme complète pour apprendre le QA Engineering"
    />
    <title>QA Engineer Academy</title>
    <style>
      :root {
        --bg: #08111f;
        --bg2: #0d1728;
        --panel: #111e31;
        --panel2: #16243a;
        --border: #263751;
        --text: #e9f0fa;
        --muted: #9aaac0;
        --accent: #2dd4bf;
        --accent2: #14b8a6;
        --good: #34d399;
        --bad: #fb7185;
        --warn: #fbbf24;
        --blue: #60a5fa;
        --code: #07101c;
        --shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--accent);
      }
      code,
      pre,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      pre {
        background: var(--code);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 10px;
        overflow: auto;
        line-height: 1.6;
        font-size: 13px;
      }
      code {
        color: #99f6e4;
      }
      h1,
      h2,
      h3 {
        line-height: 1.2;
      }
      h1 {
        font-size: clamp(25px, 4vw, 40px);
        margin: 0 0 10px;
      }
      h2 {
        font-size: 24px;
      }
      h3 {
        font-size: 17px;
      }
      p {
        line-height: 1.65;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      .hidden {
        display: none !important;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 280px;
        flex: none;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 18px 12px;
        z-index: 50;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }
      .logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(135deg, var(--accent), #99f6e4);
        color: #04201c;
        display: grid;
        place-items: center;
        font-weight: 900;
      }
      .brand b {
        font-size: 14px;
      }
      .nav {
        display: grid;
        gap: 3px;
      }
      .nav button {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 9px 10px;
        border-radius: 9px;
        text-align: left;
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 13px;
      }
      .nav button:hover {
        background: var(--panel);
        color: var(--text);
      }
      .nav button.active {
        background: rgba(45, 212, 191, 0.13);
        color: var(--accent);
        border-color: rgba(45, 212, 191, 0.18);
      }
      .nav .lock {
        opacity: 0.42;
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(8, 17, 31, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .menu {
        display: none;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .search {
        position: relative;
        flex: 1;
        max-width: 560px;
      }
      .search input {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px 10px 36px;
        outline: none;
      }
      .search:before {
        content: "⌕";
        position: absolute;
        left: 12px;
        top: 8px;
        color: var(--muted);
        font-size: 17px;
      }
      .results {
        position: absolute;
        top: 110%;
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        max-height: 340px;
        overflow: auto;
        display: none;
        z-index: 100;
      }
      .results button {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        text-align: left;
        padding: 10px 12px;
        font-size: 13px;
      }
      .results button:hover {
        background: rgba(45, 212, 191, 0.12);
      }
      .xp,
      .theme {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 9px;
        padding: 8px 11px;
        white-space: nowrap;
        font-size: 12px;
      }
      .xp {
        color: var(--accent);
      }
      .content {
        max-width: 1100px;
        margin: auto;
        padding: 28px 24px 70px;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .hero {
        background: linear-gradient(
          135deg,
          var(--panel),
          rgba(45, 212, 191, 0.07)
        );
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: var(--shadow);
        margin-bottom: 18px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 800;
      }
      .lede {
        color: var(--muted);
        max-width: 760px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .card.click {
        cursor: pointer;
        transition: 0.15s;
      }
      .card.click:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }
      .card h3 {
        margin: 0 0 7px;
      }
      .tag {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 7px;
        font-size: 11px;
        color: var(--muted);
        margin: 3px 3px 0 0;
      }
      .tag.good {
        color: var(--good);
        border-color: rgba(52, 211, 153, 0.4);
      }
      .tag.warn {
        color: var(--warn);
        border-color: rgba(251, 191, 36, 0.4);
      }
      .tag.bad {
        color: var(--bad);
        border-color: rgba(251, 113, 133, 0.4);
      }
      .progress {
        height: 10px;
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
      }
      .progress > i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent2), var(--accent));
        transition: 0.3s;
      }
      .btn {
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: #03231f;
        font-weight: 800;
        padding: 9px 13px;
        font-size: 13px;
      }
      .btn.secondary {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn.danger {
        background: rgba(251, 113, 133, 0.13);
        color: var(--bad);
        border: 1px solid rgba(251, 113, 133, 0.35);
      }
      .btn.small {
        padding: 7px 10px;
        font-size: 12px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      .lesson {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 18px;
        margin: 13px 0;
      }
      .lesson .level {
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        border: 1px solid rgba(45, 212, 191, 0.35);
        padding: 3px 7px;
        border-radius: 5px;
        display: inline-block;
        margin-bottom: 7px;
      }
      .callout {
        border-left: 3px solid var(--accent);
        background: rgba(45, 212, 191, 0.07);
        padding: 11px 13px;
        border-radius: 8px;
        margin: 12px 0;
      }
      .callout.warn {
        border-left-color: var(--warn);
        background: rgba(251, 191, 36, 0.06);
      }
      .callout.bad {
        border-left-color: var(--bad);
        background: rgba(251, 113, 133, 0.06);
      }
      .diagram {
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        text-align: center;
        overflow: auto;
        margin: 12px 0;
      }
      .diagram .node {
        display: inline-block;
        border: 1px solid var(--accent);
        border-radius: 9px;
        padding: 9px 12px;
        margin: 4px;
        background: rgba(45, 212, 191, 0.07);
      }
      .arrow {
        color: var(--accent);
        font-weight: 900;
        padding: 0 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 13px;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 9px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--bg2);
      }
      .tabs {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .tabs button {
        background: var(--panel2);
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 8px;
      }
      .tabs button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .quizq {
        border-bottom: 1px solid var(--border);
        padding: 13px 0;
      }
      .quizq:last-child {
        border-bottom: 0;
      }
      .option {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--bg2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px;
        margin: 6px 0;
      }
      .option:hover {
        border-color: var(--accent);
      }
      .option.correct {
        border-color: var(--good);
        background: rgba(52, 211, 153, 0.12);
      }
      .option.wrong {
        border-color: var(--bad);
        background: rgba(251, 113, 133, 0.12);
      }
      .answer {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .kbd {
        font-family: monospace;
        border: 1px solid var(--border);
        background: var(--code);
        padding: 2px 5px;
        border-radius: 5px;
      }
      .toolbox {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 9px;
      }
      .toolbox .tool {
        padding: 13px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .letterbar {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 12px 0;
      }
      .letterbar button {
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .searchbox {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px;
        border-radius: 9px;
      }
      .lab-app {
        background: #fff;
        color: #111;
        border-radius: 12px;
        padding: 18px;
        border: 1px solid #ccd5e3;
      }
      .lab-app input {
        display: block;
        width: 100%;
        padding: 9px;
        margin: 7px 0;
        border: 1px solid #aaa;
        border-radius: 6px;
        color: #111;
      }
      .lab-app button {
        background: #0d9488;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
      }
      .status {
        padding: 9px;
        border-radius: 7px;
        margin-top: 8px;
        background: #eef2f7;
        color: #334155;
      }
      footer {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 20px;
      }
      @media (max-width: 850px) {
        .sidebar {
          position: fixed;
          left: 0;
          transform: translateX(-100%);
          transition: 0.2s;
          box-shadow: var(--shadow);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .menu {
          display: block;
        }
        .content {
          padding: 20px 14px 60px;
        }
        .topbar {
          padding: 10px 12px;
        }
        .theme {
          font-size: 0;
        }
        .theme:first-letter {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo">QA</div>
          <b>QA Engineer Academy</b>
        </div>
        <div class="nav" id="nav"></div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="menu" id="menuBtn">☰</button>
          <div class="search">
            <input
              id="globalSearch"
              placeholder="Rechercher un module, terme, outil…"
            />
            <div class="results" id="results"></div>
          </div>
          <span class="xp" id="xp">0 XP</span>
          <button class="theme" id="theme">☀️ Clair</button>
        </header>

        <main class="content" id="content"></main>
        <footer>
          QA Engineer Academy • plateforme pédagogique locale • progression
          enregistrée dans ton navigateur
        </footer>
      </div>
    </div>

      function renderLanguage(id, title, icon) {
        const d = LANGS[title];
        pages[id].innerHTML = `
 <div class="eyebrow">Module ${id === "js" ? "10" : id === "python" ? "11" : "12"}</div>
 <h1>${icon} ${title} pour QA</h1><p class="lede">${d.desc}</p>
 <div class="callout">Objectif : comprendre assez le langage pour lire, écrire, corriger et maintenir des scripts de test. Tu n'as pas besoin de tout apprendre avant de commencer le QA.</div>
 <input class="searchbox" id="${id}-search" placeholder="Rechercher un concept dans ${title}…">
 <div id="${id}-dict" class="grid" style="margin-top:12px"></div>
 ${completeButton(id)}`;
        const box = document.getElementById(id + "-dict");
        function draw(q = "") {
          box.innerHTML = d.items
            .filter(
              (x) =>
                x[0].toLowerCase().includes(q.toLowerCase()) ||
                x[1].toLowerCase().includes(q.toLowerCase()),
            )
            .map(
              (x) => `
   <div class="card"><h3>${x[0]}</h3><p>${x[1]}</p><pre>${escapeHTML(x[2])}</pre><p class="small"><b>Usage QA :</b> ${x[3]}</p></div>`,
            )
            .join("");
        }
        draw();
        document.getElementById(id + "-search").oninput = (e) =>
          draw(e.target.value);
      }
      function escapeHTML(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
